name: Update contribution graph

# Redraws assets/contributions.svg from the public contribution calendar.
# The portrait and card are static; rebuild them locally (see README comments).

"on":
  schedule:
    - cron: "23 5 * * *"   # ~05:23 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # standard library only, nothing to install
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/contributions.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution graph"
          git push
