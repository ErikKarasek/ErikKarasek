name: Koi

# Draws koi/koi.gif from the public activity with yalongwastaken/git-koi (MIT).
# The Action downloads a prebuilt binary, so it runs in a job that can only
# read. A second job, which never runs that binary, makes the commit.

"on":
  schedule:
    - cron: "20 0 * * *"   # just after midnight UTC, so it shows the day that ended
  workflow_dispatch: {}
  push:
    paths: [.github/workflows/koi.yml]

concurrency: koi

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # v1.0.2, pinned to the commit so a moved tag cannot change what runs here
      - uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e
        with:
          body: black
          output-dir: koi

      - uses: actions/upload-artifact@v4
        with:
          name: koi
          path: koi/koi.gif
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: draw
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: koi
          path: koi

      - name: Commit the koi if it changed
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: draw the day's koi"
          git pull --rebase --quiet
          git push
